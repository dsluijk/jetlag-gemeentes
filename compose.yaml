services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    expose:
      - 5432
    environment:
      POSTGRES_DB: jetlag
      POSTGRES_USER: jetlag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jetlag -d jetlag"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  webserver:
    build: .
    container_name: webserver
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jetlag:${POSTGRES_PASSWORD}@postgres:5432/jetlag
    ports:
      - "80:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
